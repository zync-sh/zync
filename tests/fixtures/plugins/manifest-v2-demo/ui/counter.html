<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manifest v2 Demo</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #111216; color: #f4f4f5; }
    main { max-width: 30rem; padding: 2rem; text-align: center; }
    button { border: 1px solid #3f3f46; border-radius: .5rem; padding: .55rem .9rem; background: #27272a; color: inherit; cursor: pointer; }
    button:hover { background: #3f3f46; }
    output { display: block; margin: 1rem 0; font-size: 2.5rem; font-variant-numeric: tabular-nums; }
    small { display: block; margin-top: 1.25rem; color: #a1a1aa; }
    .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: .4rem; }
    #activity-status { min-height: 1.25rem; margin-top: .75rem; font-size: .75rem; color: #a1a1aa; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main>
    <h1>Isolated plugin pane</h1>
    <p>Each split keeps its own persisted count.</p>
    <output id="count" aria-live="polite">0</output>
    <div class="actions">
      <button id="increment" type="button">Increment this pane</button>
      <button id="confirm" type="button">Test approved confirmation</button>
      <button id="network" type="button">Test approved network</button>
      <button id="pick-file" type="button">Read selected text file</button>
      <button id="pick-folder" type="button">List selected folder</button>
      <button id="write-file" type="button">Create test text file</button>
      <button id="server-home" type="button">List this server's home</button>
    </div>
    <p id="activity-status" aria-live="polite"></p>
    <small>Network, host DOM, forms, frames, and legacy Zync APIs are unavailable here.</small>
  </main>
  <script>
    const count = document.getElementById('count');
    const activityStatus = document.getElementById('activity-status');
    document.getElementById('increment').addEventListener('click', () => {
      zync.pane.postMessage({ type: 'counter:increment' });
    });
    document.getElementById('confirm').addEventListener('click', () => {
      activityStatus.textContent = 'Requesting a Zync confirmation…';
      zync.pane.postMessage({ type: 'dialog:confirm' });
    });
    document.getElementById('network').addEventListener('click', () => {
      activityStatus.textContent = 'Requesting through Zync…';
      zync.pane.postMessage({ type: 'network:test' });
    });
    document.getElementById('pick-file').addEventListener('click', () => {
      activityStatus.textContent = 'Waiting for a file selection…';
      zync.pane.postMessage({ type: 'filesystem:file' });
    });
    document.getElementById('pick-folder').addEventListener('click', () => {
      activityStatus.textContent = 'Waiting for a folder selection…';
      zync.pane.postMessage({ type: 'filesystem:directory' });
    });
    document.getElementById('write-file').addEventListener('click', () => {
      activityStatus.textContent = 'Waiting for a save destination…';
      zync.pane.postMessage({ type: 'filesystem:write' });
    });
    document.getElementById('server-home').addEventListener('click', () => {
      activityStatus.textContent = 'Reading this pane\'s server home…';
      zync.pane.postMessage({ type: 'ssh-filesystem:home' });
    });
    zync.pane.onMessage((message) => {
      if (message && message.type === 'counter:update' && Number.isSafeInteger(message.count)) {
        count.textContent = String(message.count);
      }
      if (message && ['dialog:update', 'network:update', 'filesystem:update'].includes(message.type) && typeof message.message === 'string') {
        activityStatus.textContent = message.message;
        activityStatus.style.color = message.ok ? '#86efac' : '#fca5a5';
      }
    });
    zync.pane.postMessage({ type: 'counter:read' });
  </script>
</body>
</html>
