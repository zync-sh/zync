name: CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:

jobs:
  frontend-security:
    name: Frontend security tests
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node setup
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Type-check and test
        run: |
          npm run type-check
          npm test

      - name: Test fixed assessment collector (synthetic commands only)
        run: npm run test:security-collector

  vault-crypto-known-answer:
    name: Focused Rust security (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Fetch Rust dependencies
        working-directory: src-tauri
        shell: bash
        timeout-minutes: 15
        env:
          CARGO_NET_RETRY: 2
          CARGO_HTTP_TIMEOUT: 30
        run: |
          host_target=$(rustc -vV | sed -n 's/^host: //p')
          # Retry downloads only; test failures must never be retried or hidden.
          for attempt in 1 2 3; do
            if cargo fetch --locked --target "$host_target"; then
              break
            else
              status=$?
            fi
            if [ "$attempt" -eq 3 ]; then
              exit "$status"
            fi
            delay=$((attempt * 10))
            echo "::warning::Dependency fetch failed (attempt $attempt/3); retrying in ${delay}s."
            sleep "$delay"
          done

      - name: Run focused Rust security tests
        working-directory: src-tauri
        shell: bash
        env:
          # Required only because sync commands compile with env!("GOOGLE_CLIENT_ID").
          # The vault crypto known-answer tests do not use Google OAuth.
          GOOGLE_CLIENT_ID: ci-known-answer-test-client-id
        run: |
          cargo test --frozen vault::crypto::tests::known_answer_kdf_is_reproducible -- --exact
          cargo test --frozen vault::crypto::tests::known_answer_aead_is_reproducible -- --exact
          cargo test --frozen ai::config::tests
          cargo test --frozen local_only
          cargo test --frozen commands::private_key_inspection_tests
          cargo test --frozen ssh::tests -- --test-threads=1
          cargo test --frozen ssh::transport_tests
          cargo test --frozen network_interfaces
          cargo test --frozen ssh_certificate
          cargo test --frozen file_transfers
          cargo test --frozen sftp_read
          cargo test --frozen folder_sizes
          cargo test --frozen security::
          cargo test --frozen terminal_output
          cargo test --frozen pty_output
          cargo test --frozen plugins::terminal::policy
          cargo test --frozen pty::tests
          cargo test --frozen pty_term_env

      - name: Run Windows ConPTY sideload tests
        if: matrix.platform == 'windows-latest'
        working-directory: src-tauri
        env:
          GOOGLE_CLIENT_ID: ci-known-answer-test-client-id
        run: cargo test --frozen windows_conpty

      - name: Run ignored SSH security tests on Linux
        if: matrix.platform == 'ubuntu-22.04'
        working-directory: src-tauri
        env:
          GOOGLE_CLIENT_ID: ci-known-answer-test-client-id
        run: cargo test --frozen ssh::tests -- --ignored --test-threads=1
