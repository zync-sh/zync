[package]
name = "zync"
version = "2.38.0"
description = "A modern SSH client"
authors = ["Gajendra"]
edition = "2021"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Explicit qualification tests require a supported Linux kernel and ordinary UID.
permission-runtime-tests = []

[build-dependencies]
tauri-build = { version = "2", features = [] }
sha2 = "0.11"
zip = "2.2"

[dependencies]
# Custom-scheme pane documents require the fixed Windows origin check (GHSA-7gmj-67g7-phm9).
tauri = { version = "2.12.0", features = ["macos-private-api", "protocol-asset", "webview-data-url"] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.38"
tokio = { version = "1", features = ["full"] }
# On-demand interface metadata only; no gateway probes or optional Wi-Fi enrichment.
netdev = { version = "=0.46.3", default-features = false }
# Borrow existing Tokio sockets for native per-interface options.
socket2 = { version = "0.6.2", features = ["all"] }
# Already used transitively; portable no-overwrite publication of recovery snapshots.
tempfile = "3.24"
# Use the published package; preserve RSA/compression on the ring backend.
russh = { version = "=0.64.1", default-features = false, features = ["ring", "flate2", "rsa"] }
portable-pty = "0.8"
sysinfo = "0.33"
anyhow = "1.0"
async-trait = "0.1"
# Published bounded read/write pipelining; no local protocol implementation.
russh-sftp = "=3.0.1"
uuid = { version = "1", features = ["v4"] }
dirs = "5.0"
whoami = "1.4"
tauri-plugin-dialog = "2.6.0"
tauri-plugin-updater = "2.10"
base64 = "0.21"
url = "2.5"
percent-encoding = "2.3"
# Match renderer NFC name validation using the ICU data already used by URL/IDNA.
regex = "1.12.3"
semver = "1"
tauri-plugin-clipboard-manager = "2.3.2"
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }
# Read-only application assessment clients use captured SSH streams, never local forwarding listeners.
tokio-postgres = { version = "=0.7.18", default-features = false, features = ["runtime"] }
redis = { version = "=0.32.7", default-features = false, features = ["tokio-comp", "disable-client-setinfo"] }
hyper = { version = "=1.8.1", features = ["client", "http1"] }
hyper-util = { version = "=0.1.19", features = ["tokio"] }
http-body-util = "0.1"
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
futures-util = { version = "0.3", features = ["sink"] }
# Exclude the BytesMut reserve-overflow range (RUSTSEC-2026-0007).
bytes = "1.11.1"
zip = "2.2"
log = "0.4"
# Vault crypto (Phase 0)
argon2 = { version = "0.5", features = ["zeroize"] }
chacha20poly1305 = "0.10"
hkdf = "0.13"
sha2 = "0.11"
hmac = "0.13"
ed25519-dalek = "2.2"
zeroize = { version = "1.8", features = ["derive"] }
secrecy = { version = "0.10", features = ["serde"] }
rand_core = { version = "0.6", features = ["getrandom"] }
redb = "2"
rust_xlsxwriter = { version = "=0.101.0", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["std"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native-sync-persistent", "crypto-rust"] }

[target.'cfg(any(target_os = "macos", target_os = "linux", target_os = "windows"))'.dependencies]
tauri-plugin-single-instance = { version = "2", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.56"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_WindowsProgramming", "Win32_System_Registry", "Win32_System_SystemServices", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "=0.2.180"

[target.'cfg(unix)'.dev-dependencies]
# Unix PTY test doubles implement portable-pty's libc::pid_t signature.
libc = "=0.2.180"

# Thin LTO for the PTY/SSH path without fat-LTO link times. codegen-units 8 is
# tighter than Cargo's default 16 and cheaper than 1 on Windows/macOS release CI.
[profile.release]
lto = "thin"
codegen-units = 8
